name: Deno CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2  # Update denoland/setup-deno to v2
        with:
          deno-version: v1.x

      - name: Run Tests
        run: deno test
